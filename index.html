<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRUINO — космическая электроника</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: 40px 20px;
  }

  /* звёздное небо */
  .stars, .stars2, .stars3 {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .stars {
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90px 120px, #fff, transparent),
      radial-gradient(1px 1px at 160px 60px, #fff, transparent),
      radial-gradient(1px 1px at 240px 180px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 320px 40px, #fff, transparent);
    background-size: 400px 400px;
    animation: twinkle 4s ease-in-out infinite;
  }
  .stars2 {
    background-image:
      radial-gradient(1px 1px at 50px 100px, #aef, transparent),
      radial-gradient(1.5px 1.5px at 180px 20px, #aef, transparent),
      radial-gradient(1px 1px at 280px 220px, #aef, transparent);
    background-size: 350px 350px;
    animation: twinkle 6s ease-in-out infinite reverse;
  }
  .stars3 {
    background-image:
      radial-gradient(2px 2px at 120px 80px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 300px 150px, #ffd, transparent);
    background-size: 300px 300px;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* луна */
  .moon {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fdfbfb 0%, #c9d1d9 55%, #8a939c 100%);
    box-shadow:
      0 0 60px rgba(255,255,255,0.45),
      0 0 140px rgba(160,200,255,0.25);
    margin-bottom: 40px;
    animation: float 6s ease-in-out infinite;
    position: relative;
  }
  /* кратеры */
  .moon::before, .moon::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(0,0,0,0.12);
  }
  .moon::before {
    width: 34px; height: 34px;
    top: 30px; left: 45px;
    box-shadow: 22px 46px 0 -6px rgba(0,0,0,0.10), -30px 20px 0 -10px rgba(0,0,0,0.10);
  }
  .moon::after {
    width: 20px; height: 20px;
    top: 95px; left: 95px;
    background: rgba(0,0,0,0.15);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  /* падающая звезда */
  .shooting {
    position: fixed;
    top: 12%;
    left: -10%;
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, #fff, transparent);
    transform: rotate(35deg);
    animation: shoot 9s linear infinite;
    pointer-events: none;
  }
  @keyframes shoot {
    0% { transform: translateX(0) rotate(35deg); opacity: 0; }
    5% { opacity: 1; }
    25% { transform: translateX(120vw) translateY(70vh) rotate(35deg); opacity: 0; }
    100% { opacity: 0; }
  }

  .title {
    font-size: clamp(2.5rem, 10vw, 5rem);
    font-weight: bold;
    letter-spacing: 8px;
    color: #00ffff;
    text-shadow: 0 0 10px #0ff, 0 0 40px #08a;
    animation: glow 3s ease-in-out infinite;
    margin-bottom: 12px;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 10px #0ff, 0 0 40px #08a; }
    50% { text-shadow: 0 0 20px #0ff, 0 0 70px #0ff; }
  }

  .subtitle {
    color: #aab8c5;
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 50px;
  }

  .btn {
    display: inline-block;
    padding: 18px 48px;
    border: 2px solid #00ffff;
    border-radius: 40px;
    color: #00ffff;
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .btn:hover {
    background: #00ffff;
    color: #090a0f;
    box-shadow: 0 0 40px rgba(0,255,255,0.8);
    transform: scale(1.05);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 15px rgba(0,255,255,0.3); }
    50% { box-shadow: 0 0 35px rgba(0,255,255,0.7); }
  }

  .version {
    margin-top: 24px;
    color: #678;
    font-size: 0.9rem;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>
<div class="shooting"></div>

<div class="moon"></div>

<div class="title">ASTRUINO</div>
<div class="subtitle">Космическая электроника</div>

<div class="version">Версия 1.4 • Android</div>

</body>
</html>
